<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive – Matija Ivanović</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-weight: 400;
            font-size: 18px;
            line-height: 1.6;
            color: #24292e;
            background: #f3f5f8;
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        h1 { font-size: 40px; font-weight: 600; margin-bottom: 12px; line-height: 1.25; color: #24292e; }
        h2 { font-size: 30px; font-weight: 600; margin-top: 50px; margin-bottom: 18px; line-height: 1.25; color: #24292e; }
        h3 { font-size: 22px; font-weight: 600; margin-top: 35px; margin-bottom: 14px; color: #24292e; }
        p { margin-bottom: 18px; color: #24292e; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        ul, ol { margin-left: 28px; margin-bottom: 18px; }
        li { margin-bottom: 6px; }

        code {
            background: #eef1f5;
            padding: 3px 8px;
            border-radius: 999px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9em;
        }

        pre {
            background: #f6f8fa;
            border-radius: 18px;
            padding: 18px 20px;
            overflow-x: auto;
            margin: 24px 0;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        pre code { background: none; padding: 0; border-radius: 0; }

        img {
            max-width: 100%;
            height: auto;
            margin: 24px 0;
            display: block;
            border-radius: 18px;
        }

        /* Section break: a row of round dots instead of a rule. */
        hr {
            border: none;
            width: 72px;
            height: 8px;
            margin: 48px auto;
            background: radial-gradient(circle, #c9d1d9 3px, transparent 3.5px) center / 24px 8px repeat-x;
        }

        blockquote {
            padding: 14px 22px;
            margin: 24px 0;
            color: #586069;
            font-style: italic;
            background: #f1f6fd;
            border-radius: 20px;
        }

        blockquote p { margin-bottom: 0; color: #586069; }

        .note {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 20px;
            margin: 28px 0;
            font-size: 16px;
            box-shadow: 0 2px 10px rgba(31,35,40,0.06);
        }

        .footer {
            text-align: center;
            color: #586069;
            font-size: 13px;
            padding: 24px 0;
            margin-top: 48px;
        }

        .footer p { margin-bottom: 0; color: #586069; }
        .footer a { color: #0366d6; }

        /* Rounded header bar; the current page is a blue pill. */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-bottom: 48px;
            padding: 8px 8px 8px 22px;
            background: #ffffff;
            border-radius: 999px;
            box-shadow: 0 1px 4px rgba(31,35,40,0.06);
            font-size: 13px;
        }

        .site-header a {
            color: #586069;
            text-decoration: none;
        }

        .site-header .site-name {
            font-weight: 600;
            color: #24292e;
        }

        .site-header nav {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        .site-header nav a {
            margin: 0;
            padding: 6px 12px;
            border-radius: 999px;
            transition: background 0.15s, color 0.15s;
        }

        .site-header nav a:hover {
            background: #f3f5f8;
            color: #24292e;
            text-decoration: none;
        }

        .site-header nav a.active {
            background: #0366d6;
            color: #ffffff;
            font-weight: 600;
        }

        .page-intro { color: #586069; margin-bottom: 28px; }

        .archive-list {
            list-style: none;
            margin: 0;
            padding: 8px;
            background: #ffffff;
            border-radius: 26px;
            box-shadow: 0 2px 10px rgba(31,35,40,0.06);
        }

        .archive-list li {
            margin: 0;
            padding: 12px 16px;
            border-radius: 18px;
            transition: background 0.15s;
        }

        .archive-list li:hover { background: #f3f5f8; }

        .archive-list a { font-size: 17px; font-weight: 500; }

        .archive-date {
            color: #586069;
            font-size: 13px;
            margin-left: 8px;
        }

        #archive-content .loading {
            text-align: center;
            padding: 60px 20px;
            color: #586069;
            font-size: 15px;
            background: #ffffff;
            border-radius: 26px;
        }

        @media (max-width: 680px) {
            body { font-size: 16px; padding: 32px 14px; }
            h1 { font-size: 32px; }
            .site-header { border-radius: 28px; padding: 10px 10px 10px 18px; }
        }
    </style>
</head>
<body>
    <div class="site-header">
        <a href="/" class="site-name">Matija Ivanović</a>
                <nav>
            <a href="index.html">Blog</a>
            <a href="archive.html" class="active" aria-current="page">Archive</a>
            <a href="https://github.com/matko-iv" target="_blank">GitHub</a>
            <a href="mailto:ivanovicmatija2007@gmail.com">Contact</a>
        </nav>
    </div>

    <h1>Archive</h1>
    <p class="page-intro">List of all published articles.</p>

    <div id="archive-content">
        <div class="loading">Loading...</div>
    </div>

    <div class="footer">
        <p>Matija Ivanović · <a href="mailto:ivanovicmatija2007@gmail.com">Contact</a></p>
    </div>

<script>
const POSTS = [
	'sedamnaesti-clanak.txt',
	'sesnaesti-clanak.txt',
	'cetrnaesti-clanak.txt',
	'trinaesti-clanak.txt',
	'dvanaesti-clanak.txt',
	'jedanaesti-clanak.txt',
	'deseti-clanak.txt',
	'deveti-clanak.txt',
	'osmi-clanak.txt',
	'sedmi-clanak.txt',
	'sesti-clanak.txt',
	'peti-clanak.txt',
    'prvi-clanak.txt',
    'drugi-clanak.txt',
    'treci-clanak.txt',
    'cetvrti-clanak.txt',
];

function parseDate(dateStr) {
    const months = {
        'january':0,'february':1,'march':2,'april':3,'may':4,'june':5,
        'july':6,'august':7,'september':8,'october':9,'november':10,'december':11
    };
    const parts = dateStr.split(/\s+/);
    const day = parseInt(parts[0]);
    const month = months[parts[1].toLowerCase()] || 0;
    const year = parseInt(parts[2]);
    return new Date(year, month, day);
}

async function loadArchive() {
    const container = document.getElementById('archive-content');
    const posts = [];

    for (const file of POSTS) {
        try {
            const resp = await fetch('posts/' + file);
            if (!resp.ok) continue;
            const raw = await resp.text();
            const lines = raw.split('\n');
            const title = lines[0].trim();
            const date = lines[1].trim();
            const slug = file.replace('.txt', '');
            posts.push({ title, date, slug, dateObj: parseDate(date) });
        } catch(e) {
            console.warn('Could not load: ' + file, e);
        }
    }

    posts.sort((a, b) => b.dateObj - a.dateObj);

    if (posts.length === 0) {
        container.innerHTML = '<p style="color:#586069;text-align:center;padding:40px 0;">No articles yet.</p>';
        return;
    }

    let html = '<ul class="archive-list">';
    for (const post of posts) {
        html += `<li><a href="index.html#${post.slug}">${post.title}</a><span class="archive-date">— ${post.date}</span></li>`;
    }
    html += '</ul>';
    container.innerHTML = html;
}

loadArchive();
</script>

</body>
</html>
