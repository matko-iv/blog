<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog – Matija Ivanović</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-weight: 400;
            font-size: 18px;
            line-height: 1.6;
            color: #24292e;
            background: #f3f5f8;
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 20px;
        }

        h1 { font-size: 40px; font-weight: 600; margin-bottom: 12px; line-height: 1.25; color: #24292e; }
        h2 { font-size: 30px; font-weight: 600; margin-top: 50px; margin-bottom: 18px; line-height: 1.25; color: #24292e; }
        h3 { font-size: 22px; font-weight: 600; margin-top: 35px; margin-bottom: 14px; color: #24292e; }
        p { margin-bottom: 18px; color: #24292e; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        ul, ol { margin-left: 28px; margin-bottom: 18px; }
        li { margin-bottom: 6px; }

        code {
            background: #eef1f5;
            padding: 3px 8px;
            border-radius: 999px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.9em;
        }

        pre {
            background: #f6f8fa;
            border-radius: 18px;
            padding: 18px 20px;
            overflow-x: auto;
            margin: 24px 0;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 14px;
            line-height: 1.5;
        }

        pre code { background: none; padding: 0; border-radius: 0; }

        img {
            max-width: 100%;
            height: auto;
            margin: 24px 0;
            display: block;
            border-radius: 18px;
        }

        /* Section break: a row of round dots instead of a rule. */
        hr {
            border: none;
            width: 72px;
            height: 8px;
            margin: 48px auto;
            background: radial-gradient(circle, #c9d1d9 3px, transparent 3.5px) center / 24px 8px repeat-x;
        }

        blockquote {
            padding: 14px 22px;
            margin: 24px 0;
            color: #586069;
            font-style: italic;
            background: #f1f6fd;
            border-radius: 20px;
        }

        blockquote p { margin-bottom: 0; color: #586069; }

        .note {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 20px;
            margin: 28px 0;
            font-size: 16px;
            box-shadow: 0 2px 10px rgba(31,35,40,0.06);
        }

        .footer {
            text-align: center;
            color: #586069;
            font-size: 13px;
            padding: 24px 0;
            margin-top: 48px;
        }

        .footer p { margin-bottom: 0; color: #586069; }
        .footer a { color: #0366d6; }

        /* Rounded header bar; the current page is a blue pill. */
        .site-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            margin-bottom: 48px;
            padding: 8px 8px 8px 22px;
            background: #ffffff;
            border-radius: 999px;
            box-shadow: 0 1px 4px rgba(31,35,40,0.06);
            font-size: 13px;
        }

        .site-header a {
            color: #586069;
            text-decoration: none;
        }

        .site-header .site-name {
            font-weight: 600;
            color: #24292e;
        }

        .site-header nav {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        .site-header nav a {
            margin: 0;
            padding: 6px 12px;
            border-radius: 999px;
            transition: background 0.15s, color 0.15s;
        }

        .site-header nav a:hover {
            background: #f3f5f8;
            color: #24292e;
            text-decoration: none;
        }

        .site-header nav a.active {
            background: #0366d6;
            color: #ffffff;
            font-weight: 600;
        }

        .page-intro { color: #586069; margin-bottom: 28px; }

        .latest-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 18px 22px 12px;
            margin-bottom: 36px;
            box-shadow: 0 2px 10px rgba(31,35,40,0.06);
        }

        .latest-card .latest-label {
            font-size: 14px;
            font-weight: 600;
            color: #586069;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .latest-card ul { list-style: none; margin: 0; padding: 0; }

        /* Each article is its own rounded card. */
        .article {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 34px 18px;
            box-shadow: 0 2px 10px rgba(31,35,40,0.06);
            scroll-margin-top: 20px;
        }

        .article-header { margin-bottom: 24px; }

        .article-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.25;
            color: #24292e;
            margin-bottom: 10px;
        }

        .article-date {
            display: inline-block;
            color: #586069;
            background: #f3f5f8;
            border-radius: 999px;
            padding: 3px 12px;
            font-size: 13px;
        }

        .article-body h2 { margin-top: 36px; }
        .article-body h3 { margin-top: 28px; }

        .article-divider { margin: 28px auto; }

        mjx-container[display="true"] {
            overflow-x: auto;
            overflow-y: hidden;
        }

        #blog-content .loading {
            text-align: center;
            padding: 60px 20px;
            color: #586069;
            font-size: 15px;
            background: #ffffff;
            border-radius: 28px;
        }

        @media (max-width: 680px) {
            body { font-size: 16px; padding: 32px 14px; }
            h1 { font-size: 32px; }
            h2 { font-size: 26px; }
            h3 { font-size: 20px; }
            .article { padding: 24px 20px 10px; border-radius: 24px; }
            .article-title { font-size: 26px; }
            .site-header { border-radius: 28px; padding: 10px 10px 10px 18px; }
        }
    </style>
</head>
<body>
    <div class="site-header">
        <a href="/" class="site-name">Matija Ivanović</a>
                <nav>
            <a href="index.html" class="active" aria-current="page">Blog</a>
            <a href="archive.html">Archive</a>
            <a href="https://github.com/matko-iv" target="_blank">GitHub</a>
            <a href="mailto:ivanovicmatija2007@gmail.com">Contact</a>
        </nav>
    </div>

    <h1>Blog</h1>
    <p class="page-intro">Thoughts about programming, electronics, meteorology, and other interesting topics...</p>

    <nav id="latest-posts" class="latest-card" style="display:none;">
        <p class="latest-label">Newest posts</p>
        <ul id="latest-posts-list" style="list-style:none;margin:0;padding:0;">
        </ul>
    </nav>

    <div id="blog-content">
        <div class="loading">Loading articles...</div>
    </div>

    <div class="footer">
        <p>Matija Ivanović · <a href="mailto:ivanovicmatija2007@gmail.com">Contact</a></p>
    </div>

<script>
const POSTS = [
	'sedamnaesti-clanak.txt',
	'sesnaesti-clanak.txt',
	'petnaesti-clanak.txt',
	'cetrnaesti-clanak.txt',
	'trinaesti-clanak.txt',
	'dvanaesti-clanak.txt',
	'jedanaesti-clanak.txt',
	'deseti-clanak.txt',
	'deveti-clanak.txt',
	'osmi-clanak.txt',
	'sedmi-clanak.txt',
	'sesti-clanak.txt',
    'peti-clanak.txt',
    'prvi-clanak.txt',
    'drugi-clanak.txt',
    'treci-clanak.txt',
    'cetvrti-clanak.txt',
];

function parseTxt(raw) {
    const lines = raw.split('\n');
    const title = lines[0].trim();
    const date = lines[1].trim();

    let contentStart = 2;
    while (contentStart < lines.length && lines[contentStart].trim() === '') contentStart++;

    const contentLines = lines.slice(contentStart);
    const html = renderContent(contentLines);
    return { title, date, html };
}

function renderContent(lines) {
    let html = '';
    let i = 0;
    let inList = null; // 'ul' or 'ol'

    while (i < lines.length) {
        const line = lines[i];

        if (line.trim().startsWith('```')) {
            if (inList) { html += `</${inList}>`; inList = null; }
            const lang = line.trim().slice(3).trim();
            i++;
            let code = '';
            while (i < lines.length && !lines[i].trim().startsWith('```')) {
                code += escapeHtml(lines[i]) + '\n';
                i++;
            }
            i++; 
            html += `<pre><code>${code.trimEnd()}</code></pre>\n`;
            continue;
        }

        if (line.trim().match(/^\$\$.+\$\$$/)) {
            if (inList) { html += `</${inList}>`; inList = null; }
            html += `<div>${escapeHtml(line.trim())}</div>\n`;
            i++;
            continue;
        }

        if (line.trim() === '---' || line.trim() === '***') {
            if (inList) { html += `</${inList}>`; inList = null; }
            html += '<hr>\n';
            i++;
            continue;
        }

        if (line.startsWith('## ')) {
            if (inList) { html += `</${inList}>`; inList = null; }
            html += `<h2>${inlineFormat(line.slice(3).trim())}</h2>\n`;
            i++;
            continue;
        }

        // H3
        if (line.startsWith('### ')) {
            if (inList) { html += `</${inList}>`; inList = null; }
            html += `<h3>${inlineFormat(line.slice(4).trim())}</h3>\n`;
            i++;
            continue;
        }

        if (line.startsWith('> ')) {
            if (inList) { html += `</${inList}>`; inList = null; }
            let quote = '';
            while (i < lines.length && lines[i].startsWith('> ')) {
                quote += lines[i].slice(2) + ' ';
                i++;
            }
            html += `<blockquote><p>${inlineFormat(quote.trim())}</p></blockquote>\n`;
            continue;
        }

        if (line.match(/^[-*] /)) {
            if (inList !== 'ul') {
                if (inList) html += `</${inList}>`;
                html += '<ul>\n';
                inList = 'ul';
            }
            html += `<li>${inlineFormat(line.slice(2).trim())}</li>\n`;
            i++;
            continue;
        }

        if (line.match(/^\d+\. /)) {
            if (inList !== 'ol') {
                if (inList) html += `</${inList}>`;
                html += '<ol>\n';
                inList = 'ol';
            }
            html += `<li>${inlineFormat(line.replace(/^\d+\.\s*/, '').trim())}</li>\n`;
            i++;
            continue;
        }

        if (inList && !line.match(/^[-*] /) && !line.match(/^\d+\. /)) {
            html += `</${inList}>\n`;
            inList = null;
        }

        if (line.trim() === '') {
            i++;
            continue;
        }

        if (line.trim().match(/^!\[.*\]\(.*\)$/)) {
            const m = line.trim().match(/^!\[(.*?)\]\((.*?)\)$/);
            if (m) {
                html += `<img src="${m[2]}" alt="${m[1]}">\n`;
                i++;
                continue;
            }
        }

        let para = '';
        while (i < lines.length && lines[i].trim() !== '' &&
               !lines[i].startsWith('## ') && !lines[i].startsWith('### ') &&
               !lines[i].startsWith('> ') && !lines[i].startsWith('```') &&
               !lines[i].match(/^[-*] /) && !lines[i].match(/^\d+\. /) &&
               lines[i].trim() !== '---' && lines[i].trim() !== '***' &&
               !lines[i].trim().match(/^!\[.*\]\(.*\)$/)) {
            para += lines[i] + ' ';
            i++;
        }
        if (para.trim()) {
            html += `<p>${inlineFormat(para.trim())}</p>\n`;
        }
    }

    if (inList) html += `</${inList}>\n`;
    return html;
}

function inlineFormat(text) {
    const math = [];
    text = text.replace(/\\\(.*?\\\)/g, m => {
        math.push(escapeHtml(m));
        return `\u0000${math.length - 1}\u0000`;
    });
    text = text.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" style="display:inline;margin:0;vertical-align:middle">');
    text = text.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    text = text.replace(/`(.*?)`/g, '<code>$1</code>');
    return text.replace(/\u0000(\d+)\u0000/g, (_, n) => math[n]);
}

function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function parseDate(dateStr) {
    const months = {
        'january':0,'february':1,'march':2,'april':3,'may':4,'june':5,
        'july':6,'august':7,'september':8,'october':9,'november':10,'december':11
    };
    const parts = dateStr.split(/\s+/);
    const day = parseInt(parts[0]);
    const month = months[parts[1].toLowerCase()] || 0;
    const year = parseInt(parts[2]);
    return new Date(year, month, day);
}

async function loadBlog() {
    const container = document.getElementById('blog-content');
    const posts = [];

    for (let idx = 0; idx < POSTS.length; idx++) {
        const file = POSTS[idx];
        try {
            const resp = await fetch('posts/' + file);
            if (!resp.ok) continue;
            const raw = await resp.text();
            const post = parseTxt(raw);
            const slug = file.replace('.txt', '');
            post.slug = slug;
            post.dateObj = parseDate(post.date);
            posts.push(post);
        } catch(e) {
            console.warn('Could not load: ' + file, e);
        }
    }

    posts.sort((a, b) => b.dateObj - a.dateObj);

    const latestNav = document.getElementById('latest-posts');
    const latestList = document.getElementById('latest-posts-list');
    const latestCount = Math.min(posts.length, 5);
    for (let i = 0; i < latestCount; i++) {
        const li = document.createElement('li');
        li.style.marginBottom = '4px';
        li.innerHTML = `<a href="#${posts[i].slug}" style="font-size:15px;">${posts[i].title}</a> <span style="color:#586069;font-size:13px;">— ${posts[i].date}</span>`;
        latestList.appendChild(li);
    }
    if (posts.length > 0) latestNav.style.display = 'block';

    let allHtml = '';
    for (let i = 0; i < posts.length; i++) {
        const post = posts[i];
        if (i > 0) {
            allHtml += '<hr class="article-divider">';
        }
        allHtml += `
            <article class="article" id="${post.slug}">
                <div class="article-header">
                    <div class="article-title">${post.title}</div>
                    <div class="article-date">${post.date}</div>
                </div>
                <div class="article-body">
                    ${post.html}
                </div>
            </article>`;
    }

    if (posts.length === 0) {
        container.innerHTML = '<p style="color:#586069;text-align:center;padding:40px 0;">No articles yet. Add .txt files to the posts/ folder.</p>';
    } else {
        container.innerHTML = allHtml;
    }

    loadMath();
    scrollToHash();
}

function scrollToHash() {
    if (window.location.hash) {
        const target = document.querySelector(window.location.hash);
        if (target) target.scrollIntoView({ behavior: 'smooth' });
    }
}

function loadMath() {
    window.MathJax = {
        tex: { inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$']] },
        startup: { pageReady: () => MathJax.startup.defaultPageReady().then(scrollToHash) }
    };
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js';
    document.head.appendChild(script);
}

loadBlog();
</script>

</body>
</html>
