        ul, ol {

<body>
    <div class="site-header">
        <a href="/" class="site-name">Matija Ivanović</a>
        <nav>
            <a href="#" style="color:#0366d6;font-weight:600;">Blog</a>
            <a href="https://github.com/matko-iv" target="_blank">GitHub</a>
            <a href="mailto:ivanovicmatija2007@gmail.com">Kontakt</a>
        </nav>
    </div>

    <h1>Blog</h1>
    <p style="color:#586069;margin-bottom:48px;">Razmišljanja o programiranju, meteorologiji i ostalim zanimljivim temama.</p>

    <div id="blog-content">
        <div class="loading">Učitavanje članaka...</div>
    </div>

    <div class="footer">
        <p>Matija Ivanović · <a href="mailto:ivanovicmatija2007@gmail.com">Kontakt</a></p>
    </div>

<script>
const POSTS = [
    'prvi-clanak.txt',
    'drugi-clanak.txt',
    'treci-clanak.txt',
    'cetvrti-clanak.txt',
];

function parseTxt(raw) {
    const lines = raw.split('\n');
    const title = lines[0].trim();
    const date = lines[1].trim();

    let contentStart = 2;
    while (contentStart < lines.length && lines[contentStart].trim() === '') contentStart++;

    const contentLines = lines.slice(contentStart);
    const html = renderContent(contentLines);
    return { title, date, html };
}

function renderContent(lines) {
    let html = '';
    let i = 0;
    let inList = null; // 'ul' or 'ol'

    while (i < lines.length) {
        const line = lines[i];

        if (line.trim().startsWith('```')) {
            if (inList) { html += `</${inList}>`; inList = null; }
            const lang = line.trim().slice(3).trim();
            i++;
            let code = '';
            while (i < lines.length && !lines[i].trim().startsWith('```')) {
                code += escapeHtml(lines[i]) + '\n';
                i++;
            }
            i++; 
            html += `<pre><code>${code.trimEnd()}</code></pre>\n`;
            continue;
        }

        if (line.trim() === '---' || line.trim() === '***') {
            if (inList) { html += `</${inList}>`; inList = null; }
            html += '<hr>\n';
            i++;
            continue;
        }

        if (line.startsWith('## ')) {
            if (inList) { html += `</${inList}>`; inList = null; }
            html += `<h2>${inlineFormat(line.slice(3).trim())}</h2>\n`;
            i++;
            continue;
        }

        // H3
        if (line.startsWith('### ')) {
            if (inList) { html += `</${inList}>`; inList = null; }
            html += `<h3>${inlineFormat(line.slice(4).trim())}</h3>\n`;
            i++;
            continue;
        }

        // citat
        if (line.startsWith('> ')) {
            if (inList) { html += `</${inList}>`; inList = null; }
            let quote = '';
            while (i < lines.length && lines[i].startsWith('> ')) {
                quote += lines[i].slice(2) + ' ';
                i++;
            }
            html += `<blockquote><p>${inlineFormat(quote.trim())}</p></blockquote>\n`;
            continue;
        }

        // lista neodredjena
        if (line.match(/^[-*] /)) {
            if (inList !== 'ul') {
                if (inList) html += `</${inList}>`;
                html += '<ul>\n';
                inList = 'ul';
            }
            html += `<li>${inlineFormat(line.slice(2).trim())}</li>\n`;
            i++;
            continue;
        }

        if (line.match(/^\d+\. /)) {
            if (inList !== 'ol') {
                if (inList) html += `</${inList}>`;
                html += '<ol>\n';
                inList = 'ol';
            }
            html += `<li>${inlineFormat(line.replace(/^\d+\.\s*/, '').trim())}</li>\n`;
            i++;
            continue;
        }

        if (inList && !line.match(/^[-*] /) && !line.match(/^\d+\. /)) {
            html += `</${inList}>\n`;
            inList = null;
        }

        if (line.trim() === '') {
            i++;
            continue;
        }

        if (line.trim().match(/^!\[.*\]\(.*\)$/)) {
            const m = line.trim().match(/^!\[(.*?)\]\((.*?)\)$/);
            if (m) {
                html += `<img src="${m[2]}" alt="${m[1]}">\n`;
                i++;
                continue;
            }
        }

        let para = '';
        while (i < lines.length && lines[i].trim() !== '' &&
               !lines[i].startsWith('## ') && !lines[i].startsWith('### ') &&
               !lines[i].startsWith('> ') && !lines[i].startsWith('```') &&
               !lines[i].match(/^[-*] /) && !lines[i].match(/^\d+\. /) &&
               lines[i].trim() !== '---' && lines[i].trim() !== '***' &&
               !lines[i].trim().match(/^!\[.*\]\(.*\)$/)) {
            para += lines[i] + ' ';
            i++;
        }
        if (para.trim()) {
            html += `<p>${inlineFormat(para.trim())}</p>\n`;
        }
    }

    if (inList) html += `</${inList}>\n`;
    return html;
}

function inlineFormat(text) {
    text = text.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" style="display:inline;margin:0;vertical-align:middle">');
    text = text.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
    text = text.replace(/`(.*?)`/g, '<code>$1</code>');
    return text;
}

function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function loadBlog() {
    const container = document.getElementById('blog-content');
    let allHtml = '';
    let loaded = 0;

    for (let idx = 0; idx < POSTS.length; idx++) {
        const file = POSTS[idx];
        try {
            const resp = await fetch('posts/' + file);
            if (!resp.ok) continue;
            const raw = await resp.text();
            const post = parseTxt(raw);

            if (loaded > 0) {
                allHtml += '<hr class="article-divider">';
            }

            allHtml += `
            <article class="article">
                <div class="article-header">
                    <div class="article-title">${post.title}</div>
                    <div class="article-date">${post.date}</div>
                </div>
                <div class="article-body">
                    ${post.html}
                </div>
            </article>`;
            loaded++;
        } catch(e) {
            console.warn('Ne mogu učitati: ' + file, e);
        }
    }

    if (loaded === 0) {
        container.innerHTML = '<p style="color:#586069;text-align:center;padding:40px 0;">Nema još članaka. Dodaj .txt fajlove u posts/ folder.</p>';
    } else {
        container.innerHTML = allHtml;
    }
}

loadBlog();
</script>

</body>
</html>
